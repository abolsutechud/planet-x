const SUPA_URL="https://lnpomlbkcddoobznbdpi.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxucG9tbGJrY2Rkb29iem5iZHBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNDM4NzcsImV4cCI6MjA5MzgxOTg3N30.0c0AN472rr35Sd8G1oHecpN7DZTYFvg8qz0bq5se6Aw";
const H={"apikey":SUPA_KEY,"Authorization":`Bearer ${SUPA_KEY}`,"Content-Type":"application/json","Prefer":"return=representation"};

const db={
  async get(table,query=""){
    const r=await fetch(`${SUPA_URL}/rest/v1/${table}${query}`,{headers:H});
    if(!r.ok){const t=await r.text();throw new Error(`GET ${table}: ${r.status} ${t}`);}
    return r.json();
  },
  async insert(table,body){
    const r=await fetch(`${SUPA_URL}/rest/v1/${table}`,{method:"POST",headers:H,body:JSON.stringify(body)});
    if(!r.ok){const t=await r.text();throw new Error(`INSERT ${table}: ${r.status} ${t}`);}
    return r.json();
  },
  async upsert(table,body,onConflict){
    const url=onConflict?`${SUPA_URL}/rest/v1/${table}?on_conflict=${encodeURIComponent(onConflict)}`:`${SUPA_URL}/rest/v1/${table}`;
    const r=await fetch(url,{method:"POST",headers:{...H,"Prefer":"resolution=merge-duplicates,return=representation"},body:JSON.stringify(body)});
    if(!r.ok){const t=await r.text();throw new Error(`UPSERT ${table}: ${r.status} ${t}`);}
    return r.json();
  },
  async patch(table,match,body){
    const q=Object.entries(match).map(([k,v])=>`${k}=eq.${encodeURIComponent(v)}`).join("&");
    const r=await fetch(`${SUPA_URL}/rest/v1/${table}?${q}`,{method:"PATCH",headers:H,body:JSON.stringify(body)});
    if(!r.ok){const t=await r.text();throw new Error(`PATCH ${table}: ${r.status} ${t}`);}
    return r.json();
  },
  async del(table,match){
    const q=Object.entries(match).map(([k,v])=>`${k}=eq.${encodeURIComponent(v)}`).join("&");
    const r=await fetch(`${SUPA_URL}/rest/v1/${table}?${q}`,{method:"DELETE",headers:H});
    return r.ok;
  }
};

// ── helpers ───────────────────────────────────────────────────
const initials=n=>n.split(" ").map(w=>w[0]).join("").slice(0,2);
const COLORS=["#8b5cf6","#06b6d4","#f59e0b","#ec4899","#22c55e","#3b82f6","#ef4444","#14b8a6","#f97316","#6366f1","#84cc16","#e879f9","#fb7185","#38bdf8","#a3e635"];
function netWorth(team,commodities){
  return team.cash+Object.entries(team.holdings||{}).reduce((s,[id,qty])=>{
    const c=commodities.find(x=>x.id===id);return s+qty*(c?c.price:0);
  },0);
}
const ts=()=>new Date().toLocaleTimeString();

  return <button onClick={onClick} disabled={disabled} style={{background:disabled?"#1e293b":color,border:`1px solid ${disabled?"#334155":border}`,color:disabled?"#475569":textColor,padding:"8px 14px",borderRadius:8,cursor:disabled?"not-allowed":"pointer",fontFamily:"monospace",fontSize:13,letterSpacing:.5,...style}}>{children}</button>;
}
function Input({value,onChange,placeholder,type="text",style={},onKeyDown}){
  return <input type={type} value={value} onChange={onChange} onKeyDown={onKeyDown} placeholder={placeholder} style={{padding:"8px 10px",background:"#0f172a",border:"1px solid #1e293b",borderRadius:8,color:"#e2e8f0",fontFamily:"monospace",fontSize:13,outline:"none",...style}}/>;
}
function Card({children,style={}}){

}

}

function TxBadge({type}){
  const map={buy:["#052e16","#86efac"],sell:["#1e1b4b","#c4b5fd"],salary:["#1c1917","#fbbf24"],bonus:["#052e16","#86efac"],penalty:["#450a0a","#fca5a5"],adjustment:["#172554","#93c5fd"]};
  const[bg,fg]=map[type]||["#1e293b","#94a3b8"];
  return <span style={{fontSize:10,padding:"2px 6px",borderRadius:4,background:bg,color:fg}}>{type.toUpperCase()}</span>;
}
function Sparkline({data,color,width=180,height=60}){
  if(!data||data.length<2)return <div style={{color:"#334155",fontSize:11,padding:"1rem"}}>Not enough data yet.</div>;
  const min=Math.min(...data),max=Math.max(...data),range=max-min||1;
  const pts=data.map((v,i)=>{const x=(i/(data.length-1))*width;const y=height-((v-min)/range)*(height-8)-4;return `${x},${y}`;}).join(" ");
  return(
    <svg width={width} height={height} style={{overflow:"visible"}}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth={2} strokeLinejoin="round" strokeLinecap="round"/>
      {data.map((v,i)=>{const x=(i/(data.length-1))*width;const y=height-((v-min)/range)*(height-8)-4;return <circle key={i} cx={x} cy={y} r={3} fill={color}/>;})}
    </svg>
  );
}
function Loader({msg="Loading..."}){
  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#0a0a0f",gap:16}}>
    <div style={{fontSize:40,animation:"spin 1s linear infinite"}}>🪐</div>

    <style>{`@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}`}</style>
  </div>;
}
function ErrBanner({msg,onDismiss}){
  useEffect(()=>{if(msg){const t=setTimeout(onDismiss,6000);return()=>clearTimeout(t);}},[msg]);
  if(!msg)return null;
  return <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:"#450a0a",border:"1px solid #991b1b",borderRadius:10,padding:"10px 18px",color:"#fca5a5",fontSize:13,zIndex:9999,display:"flex",gap:12,alignItems:"center",maxWidth:"calc(100vw - 32px)",boxShadow:"0 4px 24px #000c",whiteSpace:"nowrap"}}>

  </div>;

// ── PIN Login ──────────────────────────────────────────────────
function PinLogin({title,sub,icon,correctPin,onSuccess,onBack}){
  const[val,setVal]=useState("");const[err,setErr]=useState("");
  const attempt=()=>{if(val===correctPin)onSuccess();else{setErr("Incorrect PIN");setVal("");}};
  return(
    <div style={{background:"#0a0a0f",minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#111118",border:"1px solid #1e293b",borderRadius:16,padding:"3rem 2.5rem",width:320,textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:8}}>{icon}</div>
        <h2 style={{color:"#a78bfa",margin:"0 0 4px",letterSpacing:2,fontSize:18}}>{title}</h2>
        <p style={{color:"#475569",fontSize:11,margin:"0 0 2rem"}}>{sub}</p>
        <Input type="password" value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&attempt()} placeholder="Enter PIN" style={{width:"100%",textAlign:"center",fontSize:20,letterSpacing:8}}/>
        {err&&<p style={{color:"#ef4444",fontSize:12,margin:"8px 0 0"}}>{err}</p>}
        <Btn onClick={attempt} style={{width:"100%",marginTop:16,padding:"10px"}}>ENTER</Btn>

      </div>
    </div>
  );
}

// ── Team Login ─────────────────────────────────────────────────
function TeamLogin({teams,onSelect,onBack}){
  const[sel,setSel]=useState("");
  const[step,setStep]=useState("select"); // "select" | "pin"
  const[pinVal,setPinVal]=useState("");
  const[pinErr,setPinErr]=useState("");
  const[selTeam,setSelTeam]=useState(null);
  function proceedToPin(){
    if(!sel)return;
    const found=teams.find(t=>String(t.id)===String(sel));
    if(!found)return;
    setSelTeam(found);
    setStep("pin");
  }
  function attemptPin(){
    if(!selTeam)return;
    const correctPin=(selTeam.pin!=null&&selTeam.pin!=="")?(String(selTeam.pin).trim()):"0000";
    const entered=pinVal.trim();
    if(entered===correctPin){onSelect(String(sel));}
    else{setPinErr("Incorrect PIN — try again");setPinVal("");}
  }
  return(
    <div style={{background:"radial-gradient(ellipse at 50% 30%,#0d1f0d,#0a0a0f)",minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#111118",border:"1px solid #166534",borderRadius:20,padding:"3rem 2.5rem",width:380,textAlign:"center",boxShadow:"0 0 40px #22c55e18"}}>
        <div style={{fontSize:44,marginBottom:10}}>🚀</div>
        <h2 style={{color:"#86efac",margin:"0 0 4px",letterSpacing:2,fontSize:20}}>TEAM LOGIN</h2>
        {step==="select"?(
          <>
            <p style={{color:"#475569",fontSize:12,margin:"0 0 2rem"}}>SELECT YOUR TEAM</p>
            <select value={sel} onChange={e=>setSel(e.target.value)} style={{width:"100%",padding:"12px",background:"#0f172a",border:"1px solid #1e293b",borderRadius:10,color:sel?"#e2e8f0":"#475569",fontFamily:"monospace",fontSize:14,marginBottom:16}}>
              <option value="">— Choose your team —</option>
              {teams.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
            <Btn onClick={proceedToPin} disabled={!sel} color="#14532d" border="#22c55e" textColor="#86efac" style={{width:"100%",padding:"12px",fontSize:15}}>NEXT →</Btn>
          </>
        ):(
          <>
            <p style={{color:"#475569",fontSize:12,margin:"0 0 6px"}}>ENTER TEAM PIN</p>
            <p style={{color:"#86efac",fontSize:14,fontWeight:700,margin:"0 0 1.5rem"}}>{selTeam?.name}</p>
            <input type="password" value={pinVal} onChange={e=>setPinVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&attemptPin()} placeholder="Team PIN" style={{width:"100%",padding:"12px",background:"#0f172a",border:"1px solid #1e293b",borderRadius:10,color:"#e2e8f0",fontFamily:"monospace",fontSize:20,textAlign:"center",letterSpacing:8,marginBottom:10,outline:"none"}}/>
            {pinErr&&<p style={{color:"#ef4444",fontSize:12,margin:"0 0 8px"}}>{pinErr}</p>}
            <Btn onClick={attemptPin} color="#14532d" border="#22c55e" textColor="#86efac" style={{width:"100%",padding:"12px",fontSize:15}}>ENTER DASHBOARD</Btn>
            <button onClick={()=>{setStep("select");setPinVal("");setPinErr("");}} style={{background:"none",border:"none",color:"#475569",cursor:"pointer",fontSize:12,marginTop:12,fontFamily:"monospace"}}>← Back</button>
          </>
        )}
        {step==="select"&&<button onClick={onBack} style={{background:"none",border:"none",color:"#475569",cursor:"pointer",fontSize:12,marginTop:16,fontFamily:"monospace"}}>← Back</button>}
      </div>
    </div>
  );
}

// ── Display Screen ─────────────────────────────────────────────
function DisplayScreen({commodities,sorted,round,activeScenario,tradingOpen,onBack,priceHistory}){

  useEffect(()=>{
    const newFlash={};
    commodities.forEach(c=>{
      if(prevPrices.current[c.id]!=null&&prevPrices.current[c.id]!==c.price){
        newFlash[c.id]=c.price>prevPrices.current[c.id]?"up":"down";
      }
      prevPrices.current[c.id]=c.price;
    });
    if(Object.keys(newFlash).length){
      setFlash(newFlash);
      setTimeout(()=>setFlash({}),1200);

  },[commodities]);

            {commodities.map(c=>{
              const hist=priceHistory[c.id]||[];

              return(
                <div key={c.id} style={{"--gc":c.color,background:f?"transparent":"#0f172a",borderRadius:16,padding:"1.4rem 1rem",textAlign:"center",border:`1px solid ${c.color}55`,animation:f?"none":`pulseGlow 3s ease-in-out infinite`,boxShadow:`0 0 30px ${c.color}18`,transition:"background .3s",position:"relative",overflow:"hidden"}}>

function PageScenarios({scenarios,setScenarios,commodities,setCommodities,addAudit,saving}){
  const[editing,setEditing]=useState(null);
  const[form,setForm]=useState(null);
  const[newName,setNewName]=useState("");const[newDesc,setNewDesc]=useState("");
  const[basePrices,setBasePrices]=useState(commodities.map(c=>({id:c.id,price:c.price,base_price:c.base_price,icon:c.icon,name:c.name})));
  useEffect(()=>setBasePrices(commodities.map(c=>({id:c.id,price:c.price,base_price:c.base_price,icon:c.icon,name:c.name}))),[commodities]);
  const[baseMsg,setBaseMsg]=useState("");
  function openEdit(sc){
    const effects={};
    commodities.forEach(c=>{
      let val=sc.effects&&sc.effects[c.id]!=null?sc.effects[c.id]:c.price;
      // Detect old multiplier format: if stored value is <=10 but commodity price is much larger, it's a multiplier
      if(val>0&&val<=10&&c.price>10){
        val=Math.round(c.price*val); // convert multiplier → absolute
      }
      effects[c.id]=val;
    });
    setEditing(sc.id);setForm({name:sc.name,description:sc.description,effects});
  }
  async function saveEdit(){
    const updated={...form};
    await db.patch("scenarios",{id:editing},updated);
    setScenarios(s=>s.map(x=>x.id===editing?{...x,...updated}:x));
    addAudit(`Scenario updated: ${form.name}`);setEditing(null);setForm(null);
  }
  async function saveBasePrices(){
    for(const c of basePrices){
      await db.patch("commodities",{id:c.id},{price:c.price,base_price:c.price});
    }
    setCommodities(prev=>prev.map(c=>{const b=basePrices.find(x=>x.id===c.id);return b?{...c,price:b.price,base_price:b.price}:c;}));
    setBaseMsg("✅ Base prices saved");addAudit("Base (Round 1) prices updated");
    setTimeout(()=>setBaseMsg(""),2500);
  }
  async function deleteScenario(id){
    await db.del("scenarios",{id});
    setScenarios(s=>s.filter(x=>x.id!==id));addAudit("Scenario deleted");
  }
  async function addScenario(){
    if(!newName.trim())return;
    const effects=Object.fromEntries(commodities.map(c=>[c.id,c.price]));
    const row={id:`sc${Date.now()}`,name:newName,description:newDesc,effects};
    await db.insert("scenarios",[row]);
    setScenarios(s=>[...s,row]);
    addAudit(`Scenario added: ${newName}`);setNewName("");setNewDesc("");
  }
  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1rem",marginBottom:"1.5rem"}}>
        {scenarios.map(sc=>(
          <Card key={sc.id}>
            {editing===sc.id&&form?(
              <div>
                <Input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} style={{width:"100%",marginBottom:8,boxSizing:"border-box"}}/>
                <Input value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} style={{width:"100%",marginBottom:12,boxSizing:"border-box"}}/>
                <SectionLabel>Prices for this Round</SectionLabel>
                {commodities.map(c=>(
                  <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                    <span style={{fontSize:16}}>{c.icon}</span>
                    <span style={{flex:1,fontSize:13,color:"#e2e8f0"}}>{c.name}</span>
                    <span style={{color:"#64748b",fontSize:13}}>🪙</span>
                    <Input type="number" value={form.effects[c.id]!=null?form.effects[c.id]:c.price} onChange={e=>setForm(f=>({...f,effects:{...f.effects,[c.id]:parseInt(e.target.value)||0}}))} style={{width:90,textAlign:"center"}}/>
                  </div>
                ))}
                <div style={{display:"flex",gap:6,marginTop:10}}>
                  <Btn onClick={saveEdit} color="#14532d" border="#22c55e" textColor="#86efac" style={{flex:1}}>Save</Btn>
                  <Btn onClick={()=>setEditing(null)} color="#1e293b" border="#334155" style={{flex:1}}>Cancel</Btn>
                </div>
              </div>
            ):(
              <div>
                <p style={{margin:"0 0 2px",fontSize:14,color:"#e2e8f0",fontWeight:700}}>{sc.name}</p>
                <p style={{margin:"0 0 10px",fontSize:11,color:"#64748b"}}>{sc.description}</p>
                <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:12}}>
                  {commodities.map(c=>{let price=sc.effects&&sc.effects[c.id]!=null?sc.effects[c.id]:c.price;if(price>0&&price<=10&&c.price>10)price=Math.round(c.price*price);return <span key={c.id} style={{fontSize:11,padding:"2px 6px",borderRadius:4,background:"#0f172a",color:"#a78bfa"}}>{c.icon} 🪙{price.toLocaleString()}</span>;})}
                </div>
                <div style={{display:"flex",gap:6}}>
                  <Btn onClick={()=>openEdit(sc)} style={{flex:1,padding:"6px"}}>✏ Edit</Btn>
                  <Btn onClick={()=>deleteScenario(sc.id)} color="#450a0a" border="#991b1b" textColor="#fca5a5" style={{flex:1,padding:"6px"}}>✕ Delete</Btn>
                </div>
              </div>
            )}
          </Card>
        ))}
      </div>
      <Card style={{marginBottom:"1rem"}}>
        <SectionLabel>Base Prices — Round 1 Starting Prices</SectionLabel>
        <p style={{color:"#64748b",fontSize:12,margin:"0 0 12px"}}>These are the prices at the start of the game (Round 1). Edit and save to change what prices reset to.</p>
        {basePrices.map((c,i)=>(
          <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <span style={{fontSize:16}}>{c.icon}</span>
            <span style={{flex:1,fontSize:13,color:"#e2e8f0"}}>{c.name}</span>
            <span style={{color:"#64748b",fontSize:13}}>🪙</span>
            <Input type="number" value={c.price} onChange={e=>setBasePrices(p=>p.map((x,j)=>j===i?{...x,price:parseInt(e.target.value)||0}:x))} style={{width:100,textAlign:"center"}}/>
          </div>
        ))}
        {baseMsg&&<p style={{fontSize:12,color:"#86efac",margin:"8px 0 0"}}>{baseMsg}</p>}
        <Btn onClick={saveBasePrices} color="#14532d" border="#22c55e" textColor="#86efac" style={{marginTop:10}}>✓ Save Base Prices</Btn>
      </Card>
      <Card>
        <SectionLabel>Add New Scenario</SectionLabel>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <Input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Scenario name" style={{flex:1}}/>
          <Input value={newDesc} onChange={e=>setNewDesc(e.target.value)} placeholder="Short description" style={{flex:2}}/>
        </div>
        <Btn onClick={addScenario} color="#14532d" border="#22c55e" textColor="#86efac">+ Add Scenario</Btn>
      </Card>
    </div>
  );
}

function PageCommodities({commodities,setCommodities,addAudit}){
  const[form,setForm]=useState(commodities.map(c=>({...c})));
  useEffect(()=>setForm(commodities.map(c=>({...c}))),[commodities]);

    for(const c of form){
      await db.patch("commodities",{id:c.id},{name:c.name,icon:c.icon,color:c.color,price:c.price});
    }
    setCommodities(form.map(c=>({...c})));addAudit("Commodities updated");
  }
  async function addComm(){
    const row={id:`cm${Date.now()}`,name:"New Commodity",icon:"🔮",color:"#a78bfa",base_price:500,price:500,sort_order:form.length};
    await db.insert("commodities",[row]);
    setForm(f=>[...f,row]);
  }
  async function del(idx){
    const c=form[idx];
    await db.del("commodities",{id:c.id});
    setForm(f=>f.filter((_,i)=>i!==idx));

  return(
    <Card>
      <SectionLabel>Commodities — Edit Names, Icons, Colors & Prices</SectionLabel>
      <div style={{display:"grid",gap:10,marginBottom:12}}>
        <div style={{display:"grid",gridTemplateColumns:"44px 1fr 130px 110px 40px 36px",gap:8,padding:"0 4px"}}>

        {form.map((c,i)=>(
          <div key={c.id} style={{display:"grid",gridTemplateColumns:"44px 1fr 130px 110px 40px 36px",gap:8,alignItems:"center",background:"#0f172a",padding:"10px 12px",borderRadius:8}}>
            <Input value={c.icon} onChange={e=>setForm(f=>f.map((x,j)=>j===i?{...x,icon:e.target.value}:x))} style={{width:36,textAlign:"center",padding:"6px 4px",fontSize:18}}/>
            <Input value={c.name} onChange={e=>setForm(f=>f.map((x,j)=>j===i?{...x,name:e.target.value}:x))} style={{width:"100%",boxSizing:"border-box"}}/>
            <Input value={c.color} onChange={e=>setForm(f=>f.map((x,j)=>j===i?{...x,color:e.target.value}:x))} style={{width:"100%",boxSizing:"border-box"}}/>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{color:"#64748b",fontSize:13}}>🪙</span>
              <Input type="number" value={c.price} onChange={e=>setForm(f=>f.map((x,j)=>j===i?{...x,price:parseInt(e.target.value)||0}:x))} style={{width:"100%",boxSizing:"border-box",textAlign:"center"}}/>
            </div>
            <div style={{width:28,height:28,borderRadius:"50%",background:c.color,border:"2px solid #1e293b"}}/>
            <button onClick={()=>del(i)} style={{background:"#450a0a",border:"none",borderRadius:6,color:"#fca5a5",cursor:"pointer",fontSize:14,width:32,height:32}}>✕</button>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8}}>
        <Btn onClick={addComm} color="#0c1a2e" border="#1d4ed8" textColor="#93c5fd">+ Add</Btn>
        <Btn onClick={save} color="#14532d" border="#22c55e" textColor="#86efac">✓ Save Changes</Btn>
      </div>
    </Card>
  );
}

function PageSalaries({salaries,setSalaries,addAudit,pendingSalaries,approveSalary,approveAllSalaries,teams}){
  const[form,setForm]=useState([...salaries]);
  useEffect(()=>setForm([...salaries]),[salaries]);
  async function save(){
    for(let i=0;i<form.length;i++){

function PageTeams({teams,setTeams,commodities,addAudit,sorted,applyTx}){
  const[selId,setSelId]=useState(null);
  const[newName,setNewName]=useState("");
  const[adjAmt,setAdjAmt]=useState(500);
  const[adjReason,setAdjReason]=useState("");
  const[adjType,setAdjType]=useState("add");
  const team=teams.find(t=>t.id===selId);
  async function addTeam(){
    if(!newName.trim())return;
    const nc={id:`t${Date.now()}`,name:newName,color:COLORS[teams.length%COLORS.length],cash:initialBalance||3000,holdings:Object.fromEntries(commodities.map(c=>[c.id,0])),transactions:[]};
    await db.insert("teams",[{id:nc.id,name:nc.name,color:nc.color,cash:nc.cash}]);
    for(const c of commodities){await db.insert("holdings",[{team_id:nc.id,commodity_id:c.id,quantity:0}]);}
    setTeams(t=>[...t,nc]);addAudit(`Team added: ${newName}`);setNewName("");
  }
  async function delTeam(id){
    await db.del("teams",{id});
    setTeams(t=>t.filter(x=>x.id!==id));if(selId===id)setSelId(null);addAudit("Team removed");
  }
  async function applyAdj(){
    if(!adjReason||!team)return;
    const delta=adjType==="add"?adjAmt:-adjAmt;
    await applyTx(team.id,"adjustment",null,1,Math.abs(delta),adjReason);
    addAudit(`Cash ${adjType==="add"?"+":"-"}🪙${adjAmt} → ${team.name}: ${adjReason}`);setAdjReason("");
  }
  return(
    <div style={{display:"grid",gridTemplateColumns:"1fr 1.4fr",gap:"1.5rem"}}>
      <Card>
        <SectionLabel>All Teams</SectionLabel>
        <div style={{display:"flex",gap:6,marginBottom:12}}>
          <Input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="New team name" style={{flex:1}}/>
          <Btn onClick={addTeam} color="#14532d" border="#22c55e" textColor="#86efac">Add</Btn>
        </div>
        <div style={{maxHeight:420,overflowY:"auto"}}>
          {sorted.map((t,i)=>(
            <div key={t.id} onClick={()=>setSelId(t.id)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:8,cursor:"pointer",background:selId===t.id?"#1e1b4b":"transparent",border:selId===t.id?"1px solid #3730a3":"1px solid transparent",marginBottom:4}}>
              <span style={{color:"#475569",fontSize:11,width:18}}>#{i+1}</span>
              <Avatar name={t.name} color={t.color} size={30}/>
              <div style={{flex:1}}><p style={{margin:0,fontSize:13,color:"#e2e8f0"}}>{t.name}</p><p style={{margin:0,fontSize:11,color:"#64748b"}}>🪙 {netWorth(t,commodities).toLocaleString()}</p></div>
              <button onClick={e=>{e.stopPropagation();delTeam(t.id);}} style={{background:"#450a0a",border:"none",borderRadius:4,color:"#fca5a5",cursor:"pointer",fontSize:11,padding:"2px 7px"}}>✕</button>
            </div>
          ))}
        </div>
      </Card>
      <div>
        {!team?<Card><p style={{color:"#334155",textAlign:"center",padding:"2rem 0"}}>Select a team to view details.</p></Card>:(
          <Card>
            <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:"1rem"}}>
              <Avatar name={team.name} color={team.color} size={44}/>
              <div>
                <p style={{margin:0,fontSize:16,color:"#e2e8f0"}}>{team.name}</p>
                <p style={{margin:0,fontSize:12,color:"#22c55e"}}>🪙 {team.cash.toLocaleString()} cash · NW: 🪙 {netWorth(team,commodities).toLocaleString()}</p>
              </div>
            </div>
            <SectionLabel>Holdings</SectionLabel>
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginBottom:"1rem"}}>
              {commodities.map(c=>(<div key={c.id} style={{background:"#0f172a",borderRadius:8,padding:"8px",textAlign:"center",opacity:(team.holdings[c.id]||0)===0?.4:1}}><div style={{fontSize:18}}>{c.icon}</div><div style={{fontSize:13,color:c.color,fontWeight:700}}>{team.holdings[c.id]||0}</div><div style={{fontSize:10,color:"#64748b"}}>{c.name}</div></div>))}
            </div>
            <SectionLabel>Cash Adjustment</SectionLabel>
            <div style={{display:"flex",gap:6,marginBottom:8}}>
              {["add","deduct"].map(type=>(<button key={type} onClick={()=>setAdjType(type)} style={{flex:1,padding:"7px",background:adjType===type?(type==="add"?"#052e16":"#450a0a"):"#0f172a",border:`1px solid ${adjType===type?(type==="add"?"#22c55e":"#ef4444"):"#1e293b"}`,color:adjType===type?(type==="add"?"#86efac":"#fca5a5"):"#64748b",borderRadius:7,cursor:"pointer",fontSize:12,fontFamily:"monospace"}}>{type==="add"?"＋ Add Cash":"－ Deduct Cash"}</button>))}
            </div>
            <div style={{display:"flex",gap:6,marginBottom:8}}>
              <Input type="number" value={adjAmt} onChange={e=>setAdjAmt(parseInt(e.target.value)||0)} style={{width:100}}/>
              <Input value={adjReason} onChange={e=>setAdjReason(e.target.value)} placeholder="Reason" style={{flex:1}}/>
            </div>
            <Btn onClick={applyAdj} style={{width:"100%",marginBottom:"1rem"}}>Apply</Btn>
            <SectionLabel>Recent Transactions</SectionLabel>
            <div style={{maxHeight:160,overflowY:"auto"}}>
              {(team.transactions||[]).slice(0,20).map((tx,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:"1px solid #0f172a",fontSize:12}}>
                  <div style={{display:"flex",gap:6,alignItems:"center"}}><TxBadge type={tx.type}/><span style={{color:"#94a3b8"}}>{tx.reason}</span></div>
                  <span style={{color:["sell","salary","bonus"].includes(tx.type)?"#22c55e":"#ef4444"}}>{["sell","salary","bonus"].includes(tx.type)?"+":"-"}🪙{(tx.qty*(tx.amount||0)||tx.amount).toLocaleString()}</span>
                </div>
              ))}
            </div>
          </Card>
        )}
      </div>
    </div>
  );
}

              <SectionLabel>Initial Team Balance</SectionLabel>
              <p style={{color:"#64748b",fontSize:13,margin:"0 0 12px"}}>Cash each team starts with on reset or when added.</p>
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:10}}>
                <span style={{color:"#64748b",fontSize:16}}>🪙</span>
                <Input type="number" value={balVal} onChange={e=>setBalVal(e.target.value)} style={{width:120,textAlign:"center"}}/>
              </div>
              {balMsg&&<p style={{fontSize:12,color:balMsg.startsWith("✅")?"#86efac":"#fca5a5",margin:"0 0 8px"}}>{balMsg}</p>}
              <Btn onClick={saveBalance} color="#14532d" border="#22c55e" textColor="#86efac">Save Balance</Btn>
            </Card>
          </div>
        </div>
      )}

      {/* ── RESET GAME TAB ── */}
      {miniTab==="reset"&&(
        <Card style={{border:"1px solid #991b1b",maxWidth:520}}>
          <SectionLabel>Reset Game</SectionLabel>
          <p style={{color:"#64748b",fontSize:13,margin:"0 0 16px"}}>Resets all teams to initial balance, clears all holdings, transactions, and round history. Commodity prices return to base. Scenarios and team PINs are preserved. This is irreversible.</p>
          {!resetConfirm?(
            <Btn onClick={()=>setResetConfirm(true)} color="#450a0a" border="#dc2626" textColor="#fca5a5" style={{width:"100%",padding:"10px"}}>⚠ Reset Entire Game</Btn>
          ):(
            <div>
              <p style={{color:"#fca5a5",fontSize:13,margin:"0 0 10px",fontWeight:700}}>Type <span style={{color:"#ef4444",letterSpacing:2}}>RESET</span> to confirm:</p>
              <Input value={resetInput} onChange={e=>setResetInput(e.target.value)} placeholder="Type RESET" style={{width:"100%",marginBottom:10,boxSizing:"border-box",border:"1px solid #991b1b",textAlign:"center",letterSpacing:3,textTransform:"uppercase"}}/>
              <div style={{display:"flex",gap:6}}>
                <Btn onClick={handleReset} disabled={resetInput!=="RESET"} color="#450a0a" border="#dc2626" textColor="#fca5a5" style={{flex:1,padding:"9px"}}>⚠ Confirm Reset</Btn>
                <Btn onClick={()=>{setResetConfirm(false);setResetInput("");}} color="#1e293b" border="#334155" style={{flex:1,padding:"9px"}}>Cancel</Btn>
              </div>
            </div>
          )}
        </Card>
      )}
    </div>
  );
}

// ── Operator Portal ────────────────────────────────────────────
function OperatorPortal({operatorPin,commodities,teams,tradingOpen,applyTx,addAudit,onLogout,round}){
  const[authed,setAuthed]=useState(false);
  const[selTeam,setSelTeam]=useState(null);
  const[txType,setTxType]=useState("buy");
  const[selComm,setSelComm]=useState(commodities[0]?.id);
  const[qty,setQty]=useState(1);
  const[bonusAmt,setBonusAmt]=useState(500);
  const[bonusReason,setBonusReason]=useState("");
  const[search,setSearch]=useState("");
  const[toast,setToast]=useState(null);
  const[toastType,setToastType]=useState("success");
  function showToast(message,type="success"){setToast(message);setToastType(type);setTimeout(()=>setToast(null),2800);}
  if(!authed)return <PinLogin title="OPERATOR STATION" sub="TRADING OPERATIONS" icon="⚙" correctPin={operatorPin} onSuccess={()=>setAuthed(true)} onBack={onLogout}/>;
  const team=teams.find(t=>t.id===selTeam);
  const comm=commodities.find(c=>c.id===selComm);
  const filtered=teams.filter(t=>t.name.toLowerCase().includes(search.toLowerCase()));
  async function doTrade(){
    if(!team||!tradingOpen)return;
    const total=qty*(comm?.price||0);
    if(txType==="buy"&&team.cash<total){showToast("Insufficient funds","error");return;}
    if(txType==="sell"&&(team.holdings[selComm]||0)<qty){showToast("Insufficient stock","error");return;}
    await applyTx(team.id,txType,selComm,qty,comm.price,`${txType} ${comm.name}`);
    addAudit(`[OP] ${txType.toUpperCase()} ${qty}x ${comm.name} @ 🪙${comm.price} for ${team.name}`);
    showToast(`${txType==="buy"?"🛒 Bought":"💰 Sold"} ${qty}x ${comm.name}\n🪙 ${(qty*(comm?.price||0)).toLocaleString()} ${txType==="buy"?"spent":"received"}`);setQty(1);
  }
  async function doBonus(isBonus){
    if(!team||!bonusReason){showToast("Add a reason","error");return;}
    await applyTx(team.id,isBonus?"bonus":"penalty",null,1,bonusAmt,bonusReason);
    addAudit(`[OP] ${isBonus?"BONUS":"PENALTY"} 🪙${bonusAmt} → ${team.name}: ${bonusReason}`);
    showToast(`${isBonus?"✅ Bonus":"⚠ Penalty"} 🪙${bonusAmt.toLocaleString()} applied to ${team.name}`);setBonusReason("");
  }
  return(
    <div style={{background:"#0a0a0f",minHeight:"100vh",fontFamily:"monospace",color:"#e2e8f0"}}>
      <div style={{background:"#0d0d14",borderBottom:"1px solid #1e293b",padding:"12px 1.5rem",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{color:"#93c5fd",fontSize:15,fontWeight:700}}>⚙ OPERATOR STATION</span>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <span style={{fontSize:12,color:tradingOpen?"#22c55e":"#ef4444",background:tradingOpen?"#052e16":"#450a0a",padding:"4px 10px",borderRadius:20,border:`1px solid ${tradingOpen?"#166534":"#991b1b"}`}}>● {tradingOpen?"TRADING OPEN":"TRADING CLOSED"}</span>
          <button onClick={onLogout} style={{background:"none",border:"1px solid #1e293b",borderRadius:8,color:"#475569",cursor:"pointer",fontFamily:"monospace",fontSize:12,padding:"5px 12px"}}>🚪 Logout</button>
        </div>
      </div>
      <div style={{padding:"1.5rem",display:"grid",gridTemplateColumns:"280px 1fr",gap:"1.5rem"}}>
        <div>
          <Card style={{marginBottom:"1rem"}}>
            <SectionLabel>Market Prices</SectionLabel>
            <div style={{display:"grid",gap:4}}>
              {commodities.map(c=>(
                <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,background:"#0f172a",borderRadius:6,padding:"6px 10px",border:`1px solid ${c.color}22`}}>
                  <span style={{fontSize:16}}>{c.icon}</span>
                  <span style={{flex:1,fontSize:12,color:"#94a3b8"}}>{c.name}</span>
                  <span style={{fontSize:13,fontWeight:700,color:c.color}}>🪙 {c.price.toLocaleString()}</span>
                </div>
              ))}
            </div>
          </Card>
          <Card>
            <SectionLabel>Select Team</SectionLabel>
            <Input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search teams..." style={{width:"100%",marginBottom:8,boxSizing:"border-box"}}/>
            <div style={{maxHeight:220,overflowY:"auto"}}>
              {filtered.map(t=>(
                <div key={t.id} onClick={()=>setSelTeam(t.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:8,cursor:"pointer",background:selTeam===t.id?"#1e1b4b":"transparent",border:selTeam===t.id?"1px solid #3730a3":"1px solid transparent",marginBottom:4}}>
                  <Avatar name={t.name} color={t.color} size={32}/>
                  <div style={{flex:1}}><p style={{margin:0,fontSize:13,color:"#e2e8f0"}}>{t.name}</p><p style={{margin:0,fontSize:11,color:"#64748b"}}>🪙 {t.cash.toLocaleString()} cash</p></div>
                </div>
              ))}
            </div>
          </Card>
        </div>
        <Card>
          <SectionLabel>Transaction</SectionLabel>
          {!team?<p style={{color:"#334155",textAlign:"center",padding:"2rem 0"}}>Select a team to begin.</p>:(
            <>
              <div style={{display:"flex",alignItems:"center",gap:10,background:"#0f172a",padding:"10px 12px",borderRadius:8,marginBottom:12}}>
                <Avatar name={team.name} color={team.color} size={34}/>
                <div><p style={{margin:0,fontSize:14,color:"#e2e8f0"}}>{team.name}</p><p style={{margin:0,fontSize:12,color:"#22c55e"}}>🪙 {team.cash.toLocaleString()} cash</p></div>
              </div>
              <div style={{display:"flex",gap:6,marginBottom:12}}>
                {["buy","sell"].map(type=>(<button key={type} onClick={()=>setTxType(type)} style={{flex:1,padding:"9px",background:txType===type?(type==="buy"?"#14532d":"#450a0a"):"#0f172a",border:`1px solid ${txType===type?(type==="buy"?"#22c55e":"#ef4444"):"#1e293b"}`,color:txType===type?(type==="buy"?"#86efac":"#fca5a5"):"#64748b",borderRadius:8,cursor:"pointer",fontSize:14,fontFamily:"monospace"}}>{type.toUpperCase()}</button>))}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:12}}>
                {commodities.map(c=>(<button key={c.id} onClick={()=>setSelComm(c.id)} style={{padding:"8px",background:selComm===c.id?"#1e1b4b":"#0f172a",border:`1px solid ${selComm===c.id?"#7c3aed":"#1e293b"}`,borderRadius:8,cursor:"pointer",textAlign:"left",fontFamily:"monospace"}}><div style={{fontSize:16}}>{c.icon}</div><div style={{fontSize:12,color:"#e2e8f0"}}>{c.name}</div><div style={{fontSize:11,color:"#a78bfa"}}>🪙 {c.price.toLocaleString()}</div>{txType==="sell"&&<div style={{fontSize:10,color:"#64748b"}}>Have: {team.holdings[c.id]||0}</div>}</button>))}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                <button onClick={()=>setQty(q=>Math.max(1,q-1))} style={{width:32,height:32,background:"#0f172a",border:"1px solid #1e293b",borderRadius:6,color:"#e2e8f0",cursor:"pointer",fontSize:16}}>−</button>
                <Input type="number" value={qty} onChange={e=>setQty(Math.max(1,parseInt(e.target.value)||1))} style={{width:60,textAlign:"center"}}/>
                <button onClick={()=>setQty(q=>q+1)} style={{width:32,height:32,background:"#0f172a",border:"1px solid #1e293b",borderRadius:6,color:"#e2e8f0",cursor:"pointer",fontSize:16}}>+</button>
                <span style={{marginLeft:"auto",color:"#a78bfa",fontSize:13}}>Total: 🪙 {(qty*(comm?.price||0)).toLocaleString()}</span>
              </div>
              <Btn onClick={doTrade} disabled={!tradingOpen} style={{width:"100%",padding:"10px"}}>{tradingOpen?`CONFIRM ${txType.toUpperCase()}`:"TRADING CLOSED"}</Btn>
              <div style={{borderTop:"1px solid #1e293b",marginTop:16,paddingTop:16}}>
                <SectionLabel>Bonus / Penalty</SectionLabel>
                <div style={{display:"flex",gap:6,marginBottom:8}}>
                  <Input type="number" value={bonusAmt} onChange={e=>setBonusAmt(parseInt(e.target.value)||0)} style={{width:90}}/>
                  <Input value={bonusReason} onChange={e=>setBonusReason(e.target.value)} placeholder="Reason" style={{flex:1}}/>
                </div>
                <div style={{display:"flex",gap:6}}>
                  <Btn onClick={()=>doBonus(true)} color="#052e16" border="#166634" textColor="#86efac" style={{flex:1}}>＋ Bonus</Btn>
                  <Btn onClick={()=>doBonus(false)} color="#450a0a" border="#991b1b" textColor="#fca5a5" style={{flex:1}}>－ Penalty</Btn>
                </div>
              </div>

            </>
          )}
        </Card>
      </div>
      {toast&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,pointerEvents:"none",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999}}>
          <div style={{background:toastType==="success"?"#052e16":"#450a0a",border:`2px solid ${toastType==="success"?"#22c55e":"#ef4444"}`,borderRadius:16,padding:"1.5rem 2.5rem",boxShadow:"0 8px 40px #000a",textAlign:"center",animation:"toastIn .25s ease",maxWidth:340}}>
            <div style={{fontSize:36,marginBottom:8}}>{toastType==="success"?"✅":"❌"}</div>
            <div style={{fontSize:16,fontWeight:700,color:toastType==="success"?"#86efac":"#fca5a5",whiteSpace:"pre-line"}}>{toast}</div>
          </div>
        </div>
      )}
      <style>{`@keyframes toastIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}`}</style>
    </div>
  );
}

// ── Team Portal ────────────────────────────────────────────────
function TeamPortal({teams,commodities,activeScenario,round,tradingOpen,sorted,onLogout,activeTeamId,setActiveTeamId,priceHistory}){
  const[loggedIn,setLoggedIn]=useState(!!activeTeamId);
  const[teamId,setTeamId]=useState(activeTeamId);
  const[tab,setTab]=useState("home");
  function handleSelect(id){setTeamId(id);setActiveTeamId(id);setLoggedIn(true);}
  if(!loggedIn)return <TeamLogin teams={teams} onSelect={handleSelect} onBack={onLogout}/>;
  const team=teams.find(t=>t.id===teamId);
  if(!team)return <TeamLogin teams={teams} onSelect={handleSelect} onBack={onLogout}/>;
  const rank=sorted.findIndex(t=>t.id===teamId)+1;
  const nw=netWorth(team,commodities);
  const holdVal=nw-team.cash;

  const tabs=[{id:"home",label:"🏠 Home"},{id:"market",label:"📈 Market"},{id:"leaderboard",label:"🏆 Leaderboard"}];

  return(
    <div style={{background:"#0a0a0f",minHeight:"100vh",fontFamily:"monospace",color:"#e2e8f0",display:"flex",flexDirection:"column"}}>

      {/* ── Header ── */}
      <div style={{background:"#0d0d14",borderBottom:"1px solid #1e293b",padding:"12px 1.5rem",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <Avatar name={team.name} color={team.color} size={34}/>
          <div>
            <p style={{margin:0,fontSize:15,color:"#e2e8f0",fontWeight:700}}>{team.name}</p>
            <p style={{margin:0,fontSize:11,color:"#64748b"}}>Rank #{rank} · Round {round} · {activeScenario?.name}</p>
          </div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <span style={{fontSize:12,color:tradingOpen?"#22c55e":"#ef4444",background:tradingOpen?"#052e16":"#450a0a",padding:"4px 10px",borderRadius:20,border:`1px solid ${tradingOpen?"#166534":"#991b1b"}`}}>● {tradingOpen?"TRADING OPEN":"CLOSED"}</span>
          <button onClick={()=>{setLoggedIn(false);setTeamId(null);setActiveTeamId(null);}} style={{background:"none",border:"1px solid #1e293b",borderRadius:8,color:"#475569",cursor:"pointer",fontFamily:"monospace",fontSize:12,padding:"5px 12px"}}>🚪 Logout</button>
        </div>
      </div>

      {/* ── Tab Bar ── */}
      <div style={{background:"#0d0d14",borderBottom:"1px solid #1e293b",padding:"0 1.5rem",display:"flex",gap:4,flexShrink:0}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"12px 20px",background:"none",border:"none",borderBottom:tab===t.id?"2px solid #a78bfa":"2px solid transparent",color:tab===t.id?"#a78bfa":"#475569",cursor:"pointer",fontFamily:"monospace",fontSize:13,fontWeight:tab===t.id?700:400,transition:"color .15s",marginBottom:-1}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* ── Tab Content ── */}
      <div style={{flex:1,overflowY:"auto",padding:"1.5rem"}}>

        {/* HOME TAB */}
        {tab==="home"&&(
          <div style={{maxWidth:900,margin:"0 auto",display:"grid",gap:"1rem"}}>

            {/* Hero stats row */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10}}>
              {[
                {label:"NET WORTH",val:`🪙 ${nw.toLocaleString()}`,color:"#a78bfa",big:true},
                {label:"HOLDINGS VALUE",val:`🪙 ${holdVal.toLocaleString()}`,color:"#3b82f6",big:true},
                {label:"CASH BALANCE",val:`🪙 ${team.cash.toLocaleString()}`,color:"#22c55e",big:false},
                {label:"LEADERBOARD RANK",val:`#${rank} of ${teams.length}`,color:"#f59e0b",big:false},
              ].map(s=>(
                <div key={s.label} style={{background:"#111118",border:`1px solid ${s.big?"#1e293b":"#1e293b"}`,borderRadius:12,padding:s.big?"18px 16px":"14px 16px"}}>
                  <p style={{margin:"0 0 6px",fontSize:10,color:"#475569",letterSpacing:1}}>{s.label}</p>
                  <p style={{margin:0,fontSize:s.big?22:16,fontWeight:700,color:s.color}}>{s.val}</p>
                </div>
              ))}
            </div>

            {/* Holdings */}
            <Card>
              <SectionLabel>Your Holdings</SectionLabel>
              <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10}}>
                {commodities.map(c=>{
                  const qty=team.holdings[c.id]||0;
                  return(
                    <div key={c.id} style={{background:"#0f172a",borderRadius:10,padding:"14px 10px",textAlign:"center",opacity:qty===0?.35:1,border:`1px solid ${c.color}33`}}>
                      <div style={{fontSize:26,marginBottom:4}}>{c.icon}</div>
                      <div style={{fontSize:20,fontWeight:700,color:c.color,marginBottom:2}}>{qty}</div>
                      <div style={{fontSize:11,color:"#64748b",marginBottom:4}}>{c.name}</div>
                      <div style={{fontSize:11,color:"#475569"}}>🪙 {(qty*c.price).toLocaleString()}</div>
                    </div>
                  );
                })}
              </div>
            </Card>

            {/* Compact market prices with absolute change */}
            <Card>
              <SectionLabel>Current Market Prices</SectionLabel>
              <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8}}>
                {commodities.map(c=>{
                  const hist=priceHistory[c.id]||[];
                  const prev=hist.length>=2?hist[hist.length-2]:null;
                  const diff=prev!=null?c.price-prev:null;
                  const bg=diff==null||diff===0?"#0f172a":diff>0?"#052e16":"#450a0a";
                  const borderColor=diff==null||diff===0?`${c.color}22`:diff>0?"#166534":"#991b1b";
                  return(
                    <div key={c.id} style={{background:bg,borderRadius:8,padding:"10px 8px",textAlign:"center",border:`1px solid ${borderColor}`,transition:"background .4s,border .4s"}}>
                      <div style={{fontSize:20,marginBottom:2}}>{c.icon}</div>
                      <div style={{fontSize:11,color:"#94a3b8",marginBottom:4}}>{c.name}</div>
                      <div style={{fontSize:15,fontWeight:700,color:c.color}}>🪙 {c.price.toLocaleString()}</div>
                      {diff!=null&&(
                        <div style={{fontSize:12,marginTop:4,color:diff>0?"#22c55e":diff<0?"#ef4444":"#64748b",fontWeight:700}}>
                          {diff>0?"▲":diff<0?"▼":"●"} {diff>0?"+":""}{diff.toLocaleString()}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </Card>

            {/* Transaction history */}
            <Card>
              <SectionLabel>Transaction History</SectionLabel>
              <div style={{maxHeight:260,overflowY:"auto"}}>
                {(team.transactions||[]).length===0
                  ?<p style={{color:"#334155",fontSize:12,margin:0}}>No transactions yet.</p>
                  :(team.transactions||[]).map((tx,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #0f172a",fontSize:12}}>
                      <div style={{display:"flex",gap:6,alignItems:"center",minWidth:0}}>
                        <TxBadge type={tx.type}/>
                        <span style={{color:"#94a3b8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{tx.reason}</span>
                      </div>
                      <div style={{textAlign:"right",flexShrink:0,marginLeft:12}}>
                        <span style={{color:["sell","salary","bonus"].includes(tx.type)?"#22c55e":"#ef4444"}}>
                          {["sell","salary","bonus"].includes(tx.type)?"+":"-"}🪙{(tx.qty*(tx.amount||0)||tx.amount).toLocaleString()}
                        </span>
                        <div style={{color:"#334155",fontSize:10}}>{tx.ts}</div>
                      </div>
                    </div>
                  ))
                }
              </div>
            </Card>
          </div>
        )}

        {/* MARKET TAB */}
        {tab==="market"&&(
          <div style={{maxWidth:900,margin:"0 auto"}}>
            <Card>
              <SectionLabel>Price History by Commodity</SectionLabel>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1rem",marginTop:4}}>
                {commodities.map(c=>{
                  const hist=priceHistory[c.id]||[c.price];
                  const latest=hist[hist.length-1];
                  const prev=hist.length>=2?hist[hist.length-2]:null;
                  const diff=prev!=null?latest-prev:null;
                  return(
                    <div key={c.id} style={{background:"#0f172a",borderRadius:12,padding:"14px",border:`1px solid ${c.color}22`,overflow:"hidden"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <span style={{fontSize:20}}>{c.icon}</span>
                          <span style={{fontSize:13,color:"#94a3b8",fontWeight:600}}>{c.name}</span>
                        </div>
                        <div style={{textAlign:"right"}}>
                          <div style={{fontSize:16,fontWeight:700,color:c.color}}>🪙 {latest.toLocaleString()}</div>
                          {diff!=null&&(
                            <div style={{fontSize:12,marginTop:2,color:diff>0?"#22c55e":diff<0?"#ef4444":"#64748b",fontWeight:700}}>
                              {diff>0?"▲":diff<0?"▼":"●"} {diff>0?"+":""}{diff.toLocaleString()}
                            </div>
                          )}
                        </div>
                      </div>
                      <Sparkline data={hist} color={c.color} width={340} height={60}/>
                      <div style={{display:"flex",justifyContent:"space-between",marginTop:6,paddingTop:4,borderTop:"1px solid #1e293b"}}>
                        {hist.map((_,i)=><span key={i} style={{fontSize:9,color:"#334155"}}>R{i+1}</span>)}
                      </div>
                    </div>
                  );
                })}
              </div>
            </Card>
          </div>
        )}

        {/* LEADERBOARD TAB */}
        {tab==="leaderboard"&&(
          <div style={{maxWidth:700,margin:"0 auto"}}>
            <Card>
              <SectionLabel>Leaderboard — Round {round}</SectionLabel>
              <div style={{display:"grid",gap:6,marginTop:4}}>
                {sorted.map((t,i)=>{
                  const tnw=netWorth(t,commodities);
                  const pct=sorted[0]?(tnw/netWorth(sorted[0],commodities))*100:100;
                  return(
                    <div key={t.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:10,background:t.id===teamId?"#1e1b4b":"#0f172a",border:t.id===teamId?"1px solid #3730a3":`1px solid ${i<3?t.color+"33":"#1e293b"}`}}>
                      <span style={{fontSize:i<3?22:13,width:32,textAlign:"center",flexShrink:0}}>{i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}.`}</span>
                      <Avatar name={t.name} color={t.color} size={32}/>
                      <div style={{flex:1,minWidth:0}}>
                        <p style={{margin:"0 0 4px",fontSize:13,color:t.id===teamId?"#c4b5fd":"#e2e8f0",fontWeight:t.id===teamId?700:400}}>{t.name}{t.id===teamId?" (you)":""}</p>
                        <div style={{height:3,background:"#1e293b",borderRadius:2}}><div style={{height:"100%",width:`${pct}%`,background:t.color,borderRadius:2,transition:"width .4s"}}/></div>
                      </div>
                      <p style={{margin:0,fontSize:14,color:"#a78bfa",fontWeight:700,flexShrink:0}}>🪙 {tnw.toLocaleString()}</p>
                    </div>
                  );
                })}
              </div>
            </Card>
          </div>
        )}

      </div>
    </div>
  );
}

// ── Root App with Supabase state ───────────────────────────────
function App(){
  const[screen,setScreen]=useState("landing");
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  const[error,setError]=useState(null);

  // Core state
  const[commodities,setCommodities]=useState([]);
  const[scenarios,setScenarios]=useState([]);
  const[salaries,setSalaries]=useState([]);
  const[teams,setTeams]=useState([]);
  const[round,setRound]=useState(1);
  const[activeScenario,setActiveScenario]=useState(null);
  const[tradingOpen,setTradingOpenState]=useState(true);
  const[auditLog,setAuditLog]=useState([]);
  const[pendingSalaries,setPendingSalaries]=useState([]);
  const[adminPin,setAdminPin]=useState("1234");
  const[operatorPin,setOperatorPin]=useState("0000");
  const[displayPin,setDisplayPin]=useState("0000");
  const[initialBalance,setInitialBalance]=useState(3000);
  const[activeTeamId,setActiveTeamId]=useState(null);
  const[priceHistory,setPriceHistory]=useState({});

  // ── Load everything from Supabase on mount ──
  useEffect(()=>{
    (async()=>{
      try{
        // Settings
        const settings=await db.get("settings");
        const sMap=Object.fromEntries(settings.map(s=>[s.key,s.value]));
        setAdminPin(sMap.admin_pin||"1234");
        setOperatorPin(sMap.operator_pin||"0000");
        setDisplayPin(sMap.display_pin||"0000");
        setInitialBalance(parseInt(sMap.initial_balance)||3000);
        const rnd=parseInt(sMap.current_round)||1;
        setRound(rnd);
        setTradingOpenState(sMap.trading_open==="true");

        // Commodities
        const comms=await db.get("commodities","?order=sort_order");
        setCommodities(comms);

        // Scenarios
        const scens=await db.get("scenarios");
        setScenarios(scens);

        // Active scenario from rounds table
        const rounds=await db.get("rounds",`?round_number=eq.${rnd}`);
        if(rounds.length>0){
          const sc=scens.find(s=>s.id===rounds[0].scenario_id)||scens[0];
          setActiveScenario(sc);
        }else{
          setActiveScenario(scens[0]||null);
        }

        // Salary schedule
        const sal=await db.get("salary_schedule","?order=round_number");
        setSalaries(sal.map(s=>s.amount));

        // Teams + holdings + recent transactions
        const teamsRaw=await db.get("teams","?order=name");
        const holdingsRaw=await db.get("holdings");
        const txRaw=await db.get("transactions","?order=created_at.desc&limit=500");

        const enriched=teamsRaw.map(t=>{
          const hMap=Object.fromEntries(holdingsRaw.filter(h=>h.team_id===t.id).map(h=>[h.commodity_id,h.quantity]));
          const txs=txRaw.filter(x=>x.team_id===t.id).slice(0,50).map(x=>({type:x.type,commodityId:x.commodity_id,qty:x.quantity,amount:x.amount,reason:x.reason,ts:new Date(x.created_at).toLocaleTimeString()}));
          return{...t,holdings:hMap,transactions:txs};
        });
        setTeams(enriched);

        // Price history from round_prices
        const allPrices=await db.get("round_prices","?order=round_number");
        const hist={};
        allPrices.forEach(p=>{
          if(!hist[p.commodity_id])hist[p.commodity_id]=[];
          hist[p.commodity_id].push(p.price);
        });
        setPriceHistory(hist);

        setLoading(false);
      }catch(e){
        setError(e.message);setLoading(false);
      }
    })();
  },[]);

  // ── Poll for live updates every 5s ──
  useEffect(()=>{
    if(loading)return;
    const poll=setInterval(async()=>{
      try{
        const settings=await db.get("settings");
        const sMap=Object.fromEntries(settings.map(s=>[s.key,s.value]));
        const newRound=parseInt(sMap.current_round)||1;
        const newOpen=sMap.trading_open==="true";
        setTradingOpenState(newOpen);

        if(newRound!==round){
          // Full reload on round change
          setRound(newRound);
          const comms=await db.get("commodities","?order=sort_order");
          setCommodities(comms);
          const scens=await db.get("scenarios");
          setScenarios(scens);
          const rounds=await db.get("rounds",`?round_number=eq.${newRound}`);
          if(rounds.length>0){const sc=scens.find(s=>s.id===rounds[0].scenario_id)||scens[0];setActiveScenario(sc);}
          const allPrices=await db.get("round_prices","?order=round_number");
          const hist={};allPrices.forEach(p=>{if(!hist[p.commodity_id])hist[p.commodity_id]=[];hist[p.commodity_id].push(p.price);});
          setPriceHistory(hist);
        }

        // Refresh teams cash + holdings
        const teamsRaw=await db.get("teams","?order=name");
        const holdingsRaw=await db.get("holdings");
        const txRaw=await db.get("transactions","?order=created_at.desc&limit=500");
        setTeams(prev=>teamsRaw.map(t=>{
          const hMap=Object.fromEntries(holdingsRaw.filter(h=>h.team_id===t.id).map(h=>[h.commodity_id,h.quantity]));
          const txs=txRaw.filter(x=>x.team_id===t.id).slice(0,50).map(x=>({type:x.type,commodityId:x.commodity_id,qty:x.quantity,amount:x.amount,reason:x.reason,ts:new Date(x.created_at).toLocaleTimeString()}));
          const old=prev.find(p=>p.id===t.id);
          return{...t,holdings:hMap,transactions:txs};
        }));
      }catch(e){console.warn("Poll error:",e.message);}
    },5000);
    return()=>clearInterval(poll);
  },[loading,round]);

  const addAudit=useCallback((msg)=>{setAuditLog(l=>[{msg,ts:ts()},...l].slice(0,200));},[]);

  // ── setTradingOpen also persists ──
  const setTradingOpen=useCallback(async(val)=>{
    const v=typeof val==="function"?val(tradingOpen):val;
    setTradingOpenState(v);
    await db.patch("settings",{key:"trading_open"},{value:String(v)});
    await db.patch("rounds",{round_number:round},{trading_open:v});
    addAudit(`Trading ${v?"OPENED":"CLOSED"}`);
  },[tradingOpen,round,addAudit]);

  // ── Apply transaction (persists to DB) ──
  const applyTx=useCallback(async(teamId,type,commodityId,qty,amount,reason)=>{
    setSaving(true);
    try{
      // 1. Insert transaction
      await db.insert("transactions",[{team_id:teamId,type,commodity_id:commodityId||null,quantity:qty,amount,reason,round_number:round}]);

      // 2. Get current team state
      const[teamRow]=await db.get("teams",`?id=eq.${teamId}`);
      let newCash=teamRow.cash;

      if(type==="buy")    newCash-=qty*amount;
      if(type==="sell")   newCash+=qty*amount;
      if(type==="salary"||type==="bonus")  newCash+=amount;
      if(type==="penalty")newCash-=amount;
      if(type==="adjustment") newCash+=amount; // caller sends signed already via delta logic

      // 3. Update cash
      await db.patch("teams",{id:teamId},{cash:newCash});

      // 4. Update holdings
      if(commodityId&&(type==="buy"||type==="sell")){
        const[existing]=await db.get("holdings",`?team_id=eq.${teamId}&commodity_id=eq.${commodityId}`);
        const curQty=existing?.quantity||0;
        const newQty=type==="buy"?curQty+qty:Math.max(0,curQty-qty);
        await db.upsert("holdings",{team_id:teamId,commodity_id:commodityId,quantity:newQty},"team_id,commodity_id");
      }

      // 5. Update local state
      setTeams(prev=>prev.map(t=>{
        if(t.id!==teamId)return t;
        let cash=t.cash,holdings={...t.holdings};
        if(type==="buy"){cash-=qty*amount;holdings[commodityId]=(holdings[commodityId]||0)+qty;}
        if(type==="sell"){cash+=qty*amount;holdings[commodityId]=Math.max(0,(holdings[commodityId]||0)-qty);}
        if(type==="salary"||type==="bonus")cash+=amount;
        if(type==="penalty")cash-=amount;
        if(type==="adjustment")cash+=amount;
        const tx={type,commodityId,qty,amount,reason,ts:ts()};
        return{...t,cash,holdings,transactions:[tx,...t.transactions].slice(0,100)};
      }));
    }catch(e){setError(e.message);}
    finally{setSaving(false);}
  },[round]);

  // ── Start round ──
  const startRound=useCallback(async(nextRound,scenarioId)=>{
    setSaving(true);
    try{
      const sc=scenarios.find(s=>s.id===scenarioId)||scenarios[0];
      const newComms=commodities.map(c=>{let p=sc.effects[c.id]!=null?sc.effects[c.id]:c.price;if(p>0&&p<=10&&c.price>10)p=Math.round(c.price*p);return{...c,price:Math.round(p)};});

      // Update commodity prices
      for(const c of newComms){
        await db.patch("commodities",{id:c.id},{price:c.price});
      }

      // Insert round record
      await db.upsert("rounds",[{round_number:nextRound,scenario_id:sc.id,trading_open:true}]);

      // Insert round_prices snapshot
      await db.insert("round_prices",newComms.map(c=>({round_number:nextRound,commodity_id:c.id,price:c.price})));

      // Persist round number + open trading
      await db.patch("settings",{key:"current_round"},{value:String(nextRound)});
      await db.patch("settings",{key:"trading_open"},{value:"true"});

      setCommodities(newComms);
      setPriceHistory(prev=>{const next={...prev};newComms.forEach(c=>{next[c.id]=[...(prev[c.id]||[]),c.price];});return next;});
      setRound(nextRound);setActiveScenario(sc);setTradingOpenState(true);

      const sal=salaries[(nextRound-1)%salaries.length];
      if(sal>0){
        setPendingSalaries(teams.map(t=>({teamId:t.id,amount:sal,round:nextRound})));
        addAudit(`Round ${nextRound} started · ${sc.name} · ${teams.length} salary approvals pending`);
      }else{
        addAudit(`Round ${nextRound} started · ${sc.name} · No salary this round`);
      }
    }catch(e){setError(e.message);}
    finally{setSaving(false);}
  },[scenarios,salaries,teams,commodities,addAudit]);

  const approveSalary=useCallback(async(teamId)=>{
    const entry=pendingSalaries.find(p=>p.teamId===teamId);
    if(!entry)return;
    await applyTx(teamId,"salary",null,1,entry.amount,`Salary R${entry.round}`);
    addAudit(`Salary approved · ${teams.find(t=>t.id===teamId)?.name} · 🪙${entry.amount.toLocaleString()}`);
    setPendingSalaries(p=>p.filter(x=>x.teamId!==teamId));
  },[pendingSalaries,applyTx,addAudit,teams]);

  const approveAllSalaries=useCallback(async()=>{
    for(const p of pendingSalaries){
      await applyTx(p.teamId,"salary",null,1,p.amount,`Salary R${p.round}`);
    }
    addAudit(`All salaries approved · Round ${round}`);
    setPendingSalaries([]);
  },[pendingSalaries,applyTx,addAudit,round]);

  const resetGame=useCallback(async()=>{
    setSaving(true);
    try{
      // 1. Reset all team cash one by one
      for(const t of teams){
        await db.patch("teams",{id:t.id},{cash:initialBalance});
      }
      // 2-5. Use stored procedure to atomically wipe holdings/transactions/rounds/round_prices
      const resetResp=await fetch(`${SUPA_URL}/rest/v1/rpc/reset_game`,{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({})});
      if(!resetResp.ok){const t=await resetResp.text();throw new Error(`reset_game RPC failed: ${resetResp.status} ${t}`);}
      // 6. Reset commodity prices to base_price (don't change base_price itself)
      const commsRaw=await db.get("commodities");
      for(const c of commsRaw){await db.patch("commodities",{id:c.id},{price:c.base_price});}
      // 7. Reset settings - only round and trading, NOT pins or balance
      await db.patch("settings",{key:"current_round"},{value:"1"});
      await db.patch("settings",{key:"trading_open"},{value:"true"});
      // 8. Seed round 1
      await db.insert("rounds",[{round_number:1,scenario_id:scenarios[0]?.id,trading_open:true}]);
      const freshComms=commsRaw.map(c=>({...c,price:c.base_price}));
      await db.insert("round_prices",freshComms.map(c=>({round_number:1,commodity_id:c.id,price:c.base_price})));
      // 9. Update local state
      setCommodities(freshComms);
      setTeams(t=>t.map(x=>({...x,cash:initialBalance,holdings:Object.fromEntries(freshComms.map(c=>[c.id,0])),transactions:[]})));
      setRound(1);setActiveScenario(scenarios[0]);setTradingOpenState(true);
      setPendingSalaries([]);setAuditLog([]);
      setPriceHistory(Object.fromEntries(freshComms.map(c=>[c.id,[c.base_price]])));
      addAudit("⚠ GAME RESET by Super Admin");
    }catch(e){setError(e.message);}
    finally{setSaving(false);}
  },[teams,scenarios,addAudit,initialBalance]);

  const sorted=[...teams].sort((a,b)=>netWorth(b,commodities)-netWorth(a,commodities));

  if(loading)return <LoadingScreen onDiag={()=>setScreen("diag")} diagMode={screen==="diag"}/>;
  if(screen==="diag")return <DiagScreen onBack={()=>setScreen("landing")}/>;

  const shared={commodities,setCommodities,scenarios,setScenarios,salaries,setSalaries,teams,setTeams,round,setRound,activeScenario,setActiveScenario,tradingOpen,setTradingOpen,auditLog,pendingSalaries,adminPin,setAdminPin,operatorPin,setOperatorPin,displayPin,setDisplayPin,initialBalance,setInitialBalance,sorted,applyTx,addAudit,startRound,approveSalary,approveAllSalaries,resetGame,activeTeamId,setActiveTeamId,setScreen,priceHistory,saving};

  return(
    <>
      <ErrBanner msg={error} onDismiss={()=>setError(null)}/>
      {screen==="landing"  &&<Landing setScreen={setScreen} adminPin={adminPin} operatorPin={operatorPin} displayPin={displayPin}/>}
      {screen==="admin"    &&<AdminPortal {...shared} onLogout={()=>setScreen("landing")}/>}
      {screen==="operator" &&<OperatorPortal {...shared} onLogout={()=>setScreen("landing")}/>}
      {screen==="team"     &&<TeamPortal {...shared} onLogout={()=>setScreen("landing")}/>}
      {screen==="display"  &&<DisplayScreen {...shared} onBack={()=>setScreen("landing")}/>}
      {screen==="diag"     &&<DiagScreen onBack={()=>setScreen("landing")}/>}
    </>
  );
}

// ── Loading screen with diag escape hatch ─────────────────────
function LoadingScreen({onDiag}){
  const[clicks,setClicks]=useState(0);
  const[err,setErr]=useState(null);
  useEffect(()=>{
    const t=setTimeout(()=>setErr("Taking too long — tap the 🪐 5 times to open diagnostics"),8000);
    return()=>clearTimeout(t);
  },[]);
  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#0a0a0f",gap:16}}>
      <div onClick={()=>{const n=clicks+1;setClicks(n);if(n>=5)onDiag();}} style={{fontSize:40,cursor:"pointer",userSelect:"none",animation:"spin 1s linear infinite"}}>🪐</div>
      <p style={{color:"#475569",fontSize:13}}>Connecting to Planet X...</p>
      {err&&<p style={{color:"#f59e0b",fontSize:12,maxWidth:280,textAlign:"center"}}>{err}</p>}
      <style>{`@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}

// ── Diagnostics screen ────────────────────────────────────────
function DiagScreen({onBack}){
  const[results,setResults]=useState([]);
  const[running,setRunning]=useState(false);
  async function runDiag(){
    setRunning(true);setResults([]);
    const tables=["settings","teams","commodities","scenarios","holdings","transactions","rounds","round_prices","salary_schedule"];
    const out=[];
    for(const t of tables){
      try{
        const r=await fetch(`${SUPA_URL}/rest/v1/${t}?limit=1`,{headers:H});
        const body=await r.text();
        if(r.ok){out.push({table:t,status:"ok",detail:`HTTP ${r.status} · ${body.length}b`});}
        else{out.push({table:t,status:"fail",detail:`HTTP ${r.status} · ${body.slice(0,120)}`});}
      }catch(e){
        out.push({table:t,status:"fail",detail:e.message});
      }
      setResults([...out]);
    }
    setRunning(false);
  }
  useEffect(()=>{runDiag();},[]);
  return(
    <div style={{background:"#0a0a0f",minHeight:"100vh",padding:"2rem",fontFamily:"monospace",color:"#e2e8f0"}}>
      <div style={{maxWidth:600,margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.5rem"}}>
          <h2 style={{color:"#a78bfa",margin:0}}>🔬 Connection Diagnostics</h2>
          <button onClick={onBack} style={{background:"none",border:"1px solid #1e293b",borderRadius:8,color:"#475569",cursor:"pointer",fontFamily:"monospace",fontSize:12,padding:"5px 12px"}}>← Back</button>
        </div>
        <div style={{background:"#111118",border:"1px solid #1e293b",borderRadius:10,padding:"1rem",marginBottom:"1rem",fontSize:12,color:"#64748b"}}>
          <p style={{margin:"0 0 4px",color:"#94a3b8"}}>Supabase URL: <span style={{color:"#a78bfa"}}>{SUPA_URL}</span></p>
          <p style={{margin:0}}>Key prefix: <span style={{color:"#a78bfa"}}>{SUPA_KEY.slice(0,20)}...</span></p>
        </div>
        <div style={{display:"grid",gap:8,marginBottom:"1rem"}}>
          {results.map(r=>(
            <div key={r.table} style={{display:"flex",alignItems:"flex-start",gap:10,background:"#111118",border:`1px solid ${r.status==="ok"?"#166534":"#991b1b"}`,borderRadius:8,padding:"10px 12px"}}>
              <span style={{fontSize:16,flexShrink:0}}>{r.status==="ok"?"✅":"❌"}</span>
              <div>
                <p style={{margin:"0 0 2px",color:"#e2e8f0",fontSize:13}}>{r.table}</p>
                <p style={{margin:0,color:r.status==="ok"?"#64748b":"#fca5a5",fontSize:11,wordBreak:"break-all"}}>{r.detail}</p>
              </div>
            </div>
          ))}
          {running&&<div style={{color:"#475569",fontSize:12,padding:"8px"}}>⏳ Testing tables...</div>}
        </div>
        {!running&&results.some(r=>r.status==="fail")&&(
          <div style={{background:"#1c1917",border:"1px solid #854d0e",borderRadius:10,padding:"1rem",fontSize:12,color:"#fbbf24"}}>
            <p style={{margin:"0 0 8px",fontWeight:700}}>⚠ Fix steps:</p>
            <p style={{margin:"0 0 4px"}}>1. Go to your Supabase project → SQL Editor</p>
            <p style={{margin:"0 0 4px"}}>2. Run the <strong>Fix SQL</strong> artifact (the one with RLS disabled)</p>
            <p style={{margin:"0 0 4px"}}>3. Check Project Settings → API → make sure your URL matches above</p>
            <p style={{margin:0}}>4. Come back here and tap "Re-run" below</p>
          </div>
        )}
        {!running&&results.every(r=>r.status==="ok")&&(
          <div style={{background:"#052e16",border:"1px solid #166534",borderRadius:10,padding:"1rem",fontSize:13,color:"#86efac",textAlign:"center"}}>
            ✅ All tables accessible — go back and reload
          </div>
        )}
        {!running&&<Btn onClick={runDiag} style={{marginTop:12,width:"100%"}}>🔄 Re-run Diagnostics</Btn>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
